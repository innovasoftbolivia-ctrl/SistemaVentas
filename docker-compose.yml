# =============================================================================
#  Sistema de Venta de Productos - entorno de desarrollo completo
#
#      docker compose up -d --build   levanta todo (la primera vez carga docs/sql)
#      docker compose logs -f app     sigue los logs de la aplicación
#      docker compose exec app sh     shell dentro del contenedor
#      docker compose down            detiene, conservando los datos
#      docker compose down -v         detiene y BORRA los datos
#
#  Aplicación -> http://localhost:8100
#  Adminer    -> http://localhost:8101
#  MySQL      -> localhost:13310  usuario root / ventas123   base ventas_db
#  Vite HMR   -> puerto 5174, lo consume el navegador solo (no se abre a mano)
#
#  Los puertos están en el rango 81xx para no chocar con los otros proyectos del
#  repositorio, que ya ocupan el 8000 (granja), el 8080 y 8081 (Aerolinea) y el
#  8090 (asistencia).
# =============================================================================

name: ventas-dev

services:
  # ---------------------------------------------------------------------------
  # Aplicación: php-fpm con el código montado desde el host
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./sistema-ventas
    container_name: ventas_app
    restart: unless-stopped
    env_file: ./sistema-ventas/.env.docker
    volumes:
      # Bind mount del proyecto: editar en el host se refleja al instante.
      - ./sistema-ventas:/var/www/html
      # vendor/ vive en un volumen y NO en el bind mount: el del host se instaló
      # desde Windows y trae rutas y binarios que no valen en Linux.
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # "Sano" = composer terminó y php-fpm acepta conexiones en el 9000.
      # Se prueba el socket con el propio PHP y no con pgrep o nc: php-fpm
      # reescribe su título de proceso y el nc de busybox no siempre trae -z.
      test: ["CMD-SHELL", "test -f vendor/autoload.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks: [ventas]

  # ---------------------------------------------------------------------------
  # Servidor web
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ventas_nginx
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./sistema-ventas/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx solo sirve estáticos: le basta public/ en modo lectura.
      - ./sistema-ventas/public:/var/www/html/public:ro
    depends_on: [app]
    healthcheck:
      # /up es el endpoint de salud de bootstrap/app.php: valida la cadena
      # completa (nginx -> php-fpm -> Laravel), no solo que el proceso viva.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks: [ventas]

  # ---------------------------------------------------------------------------
  # Base de datos
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ventas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ventas123
      TZ: America/Lima
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=-05:00
      --explicit_defaults_for_timestamp=OFF
    ports:
      # Publicado para conectar Workbench/DBeaver y para correr las pruebas
      # desde el host. La aplicación no usa este puerto: dentro de la red llega
      # por mysql:3306.
      #
      # 13310 y no 3307, por dos motivos que se acumulan:
      #
      # 1. En Windows, WinNAT reserva rangos de puertos que cambian en cada
      #    reinicio, y uno de ellos se tragó el 3307: el bind falla con «An
      #    attempt was made to access a socket in a way forbidden by its access
      #    permissions». Los rangos reservados viven en los miles bajos, así que
      #    un puerto por encima de 13000 se libra.
      #
      # 2. Cada proyecto del repositorio necesita el suyo para poder levantar
      #    dos a la vez: granja usa el 13307 y asistencia el 13309.
      - "13310:3306"
    volumes:
      - ventas_data:/var/lib/mysql
      # Al primer arranque el contenedor ejecuta estos scripts en orden
      # alfabético. El mismo montaje sirve para volver a cargarlos a mano:
      #   docker exec -i ventas_mysql mysql -uroot -pventas123 < docs/sql/01_schema_mysql.sql
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pventas123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [ventas]

  # ---------------------------------------------------------------------------
  # Vite: compilación de assets con hot-reload
  # ---------------------------------------------------------------------------
  vite:
    image: node:22-alpine
    container_name: ventas_vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm ci --ignore-scripts --no-audit --no-fund; npm run dev"
    ports:
      - "5174:5174"
    # Mismo env_file que app: sin esto, laravel-vite-plugin leería el .env del
    # host (bind mount) y tomaría de ahí APP_URL, que apunta al puerto 8000 del
    # arranque sin Docker.
    env_file: ./sistema-ventas/.env.docker
    environment:
      # Lo consume vite.config.js para escuchar en todas las interfaces y
      # vigilar los ficheros por polling (los bind mounts de Windows no emiten
      # eventos inotify, así que sin esto el hot-reload no se entera de nada).
      DOCKER: "true"
    volumes:
      - ./sistema-ventas:/var/www/html
      # Igual que con vendor: el node_modules de Linux no puede pisar el de
      # Windows, que trae binarios compilados para otra plataforma.
      - node-modules:/var/www/html/node_modules
    networks: [ventas]

  # ---------------------------------------------------------------------------
  # Adminer: explorar la base sin instalar nada
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: ventas_adminer
    restart: unless-stopped
    ports:
      # 8101 y no 8080: ese lo ocupa el nginx del proyecto Aerolinea.
      - "8101:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy
    networks: [ventas]

volumes:
  ventas_data:
  vendor:
  node-modules:

networks:
  ventas:
    driver: bridge
