; Ajustes de PHP para el entorno de desarrollo del Sistema de Ventas.

; Las fotos de producto se suben desde el formulario; 2M (el valor por defecto)
; se queda corto para una foto de móvil.
upload_max_filesize = 16M
post_max_size = 20M

memory_limit = 512M
max_execution_time = 120

; En desarrollo interesa ver el error, no ocultarlo.
display_errors = On
error_reporting = E_ALL

; Con el código en un bind mount, el timestamp del fichero es la única forma
; fiable de que OPcache se entere de un cambio. `revalidate_freq=0` lo comprueba
; en cada petición: más lento, pero sin él habría que reiniciar el contenedor
; después de cada edición.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = America/Lima
